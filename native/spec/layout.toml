  ["license_plate", "char[32]"], ["license_plate_country_id", "char[32]"],
  ["fuel_capacity", "f32"], ["fuel_warning_factor", "f32"],
  ["adblue_capacity", "f32"], ["adblue_warning_factor", "f32"],
  ["air_pressure_warning", "f32"], ["air_pressure_emergency", "f32"],
  ["oil_pressure_warning", "f32"], ["water_temperature_warning", "f32"], ["battery_voltage_warning", "f32"],
  ["rpm_limit", "f32"],
  ["forward_gear_count", "u32"], ["reverse_gear_count", "u32"], ["retarder_step_count", "u32"],
  ["differential_ratio", "f32"],
  ["forward_ratio", "f32[MAX_FORWARD_GEARS]"],
  ["reverse_ratio", "f32[MAX_REVERSE_GEARS]"],
  ["cabin_position", "Vec3"], ["head_position", "Vec3"], ["hook_position", "Vec3"],
  ["wheel_count", "u32"],
  ["wheel_position", "Vec3[MAX_WHEELS]"],
  ["wheel_radius", "f32[MAX_WHEELS]"],
  ["wheel_steerable", "u8[MAX_WHEELS]"], ["wheel_simulated", "u8[MAX_WHEELS]"],
  ["wheel_powered", "u8[MAX_WHEELS]"], ["wheel_liftable", "u8[MAX_WHEELS]"],
]

[[struct]]
name = "TrailerConfig"
fields = [
  ["seq", "u32"], ["present", "u8"], ["_pad", "u8[3]"],
  ["id", "char[64]"], ["cargo_accessory_id", "char[64]"], ["brand_id", "char[64]"], ["brand", "char[64]"],
  ["name", "char[64]"], ["chain_type", "char[32]"], ["body_type", "char[32]"],
  ["license_plate", "char[32]"], ["license_plate_country_id", "char[32]"],
  ["hook_position", "Vec3"],
  ["wheel_count", "u32"],
  ["wheel_position", "Vec3[MAX_WHEELS]"],
  ["wheel_radius", "f32[MAX_WHEELS]"],
  ["wheel_steerable", "u8[MAX_WHEELS]"], ["wheel_simulated", "u8[MAX_WHEELS]"],
  ["wheel_powered", "u8[MAX_WHEELS]"], ["wheel_liftable", "u8[MAX_WHEELS]"],
]

[[struct]]
name = "JobConfig"
fields = [
  ["seq", "u32"], ["present", "u8"], ["cargo_loaded", "u8"], ["special_job", "u8"], ["_pad", "u8"],
  ["cargo_id", "char[64]"], ["cargo", "char[64]"],
  ["cargo_mass", "f32"], ["cargo_unit_mass", "f32"], ["cargo_unit_count", "u32"],
  ["delivery_time", "u32"],             # absolute in-game minutes
  ["planned_distance_km", "u32"], ["_pad2", "u32"],
  ["income", "u64"],                    # EUR
  ["destination_city_id", "char[64]"], ["destination_city", "char[64]"],
  ["destination_company_id", "char[64]"], ["destination_company", "char[64]"],
  ["source_city_id", "char[64]"], ["source_city", "char[64]"],
  ["source_company_id", "char[64]"], ["source_company", "char[64]"],
  ["job_market", "char[32]"],
]

[[struct]]
name = "ControlsConfig"
fields = [["seq", "u32"], ["present", "u8"], ["_pad", "u8[3]"], ["shifter_type", "char[16]"]]

[[struct]]
name = "ConfigBlock"
fields = [
  ["config_seq", "u64"],                # seqlock: odd while the DLL is writing
  ["truck", "TruckConfig"],
  ["trailers", "TrailerConfig[MAX_TRAILERS]"],
  ["job", "JobConfig"],
  ["controls", "ControlsConfig"],
]

# ---------------------------------------------------------------- gameplay events

[[struct]]
name = "EventSlot"
fields = [
  ["seq", "u64"],                       # event number (1-based); slot = (seq - 1) % EVENT_SLOTS
  ["game_time", "u32"],
  ["attr_count", "u32"],
  ["id", "char[48]"],                   # e.g. "player.fined"
  ["attrs", "char[456]"],               # "name=value;name=value"
]

# ---------------------------------------------------------------- headers

[[struct]]
name = "TelemetryHeader"
fields = [
  ["magic", "u32"], ["layout_version", "u32"], ["layout_hash", "u64"],
  ["header_size", "u32"], ["frame_size", "u32"], ["ring_slots", "u32"], ["frames_offset", "u32"],
  ["config_offset", "u32"], ["config_size", "u32"], ["events_offset", "u32"], ["event_size", "u32"],
  ["event_slots", "u32"], ["game_pid", "u32"],
  ["telemetry_api_version", "u32"], ["telemetry_game_version", "u32"],
  ["input_api_version", "u32"], ["input_game_version", "u32"],
  ["input_registered", "u32"], ["input_active", "u32"],
  ["paused", "u32"], ["bridge_flags", "u32"],          # see BRIDGE_FLAG_* in gen output
  ["watchdog_ms", "u32"], ["input_count", "u32"],
  ["frame_counter", "u64"],                            # newest published frame seq (0 = none)
  ["event_write_index", "u64"],                        # events written so far
  ["qpc_frequency", "u64"],
  ["input_frames", "u64"],                             # input frames processed while active
  ["last_input_qpc", "u64"],
  ["applied_write_seq", "u64"],                        # newest controls write_seq the game has seen
  ["watchdog_trips", "u64"],
  ["kill_count", "u64"],
  ["game_name", "char[32]"], ["game_id", "char[16]"], ["bridge_version", "char[16]"],
]

[[struct]]
name = "ControlsHeader"
fields = [
  ["magic", "u32"], ["layout_version", "u32"], ["layout_hash", "u64"],
  ["client_pid", "u32"],
  ["enable", "u32"],                    # 1 = AutoHaul wants control; 0 = release everything
  ["watchdog_ms", "u32"],               # 0 = DLL default (250); clamped to [50, 1000]
  ["rearm_counter", "u32"],             # change it to clear a latched kill (only while no kill key is held)
  ["write_seq", "u64"],                 # incremented by every commit
  ["heartbeat_qpc", "u64"],             # QueryPerformanceCounter at the last commit
  ["extra_kill_vk", "u8[MAX_EXTRA_KILL_VK]"],
]

[bridge_flags]
KILL_LATCHED = 1
CONTROL_ALIVE = 2       # heartbeat fresh and enable=1
CONTROL_ACTIVE = 4      # values are being sent to the game
TELEMETRY_OK = 8
INPUT_OK = 16

