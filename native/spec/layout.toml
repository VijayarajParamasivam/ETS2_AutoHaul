# ---------------------------------------------------------------- configuration attributes
# section: config id; "{t}" expands per trailer. "trailer" (no index) is also mapped to trailer 0.
# Each section's struct is zeroed and refilled on every configuration event for that id.

[[config_section]]
id = "truck"
field = "truck"
[[config_section]]
id = "trailer.{t}"
field = "trailers[{t}]"
[[config_section]]
id = "job"
field = "job"
[[config_section]]
id = "controls"
field = "controls"

[[config]]
section = "truck"
attrs = [
