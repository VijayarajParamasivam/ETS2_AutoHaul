  ["wheel_velocity", "f32[MAX_WHEELS]"],        # rotations per second
  ["wheel_susp_deflection", "f32[MAX_WHEELS]"],
  ["wheel_on_ground", "u8[MAX_WHEELS]"],
  ["trailers", "TrailerFrame[MAX_TRAILERS]"],
  ["channel_seen", "u64[CHANNEL_SEEN_WORDS]"],   # bit per channel id: received at least once
  ["seq_end", "u64"],
