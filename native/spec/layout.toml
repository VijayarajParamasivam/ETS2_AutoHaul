# AutoHaul shared-memory layout: the single source of truth.
#
# `python tools/gen_layout.py` turns this file (plus inputs.toml) into
#   native/bridge/generated/autohaul_layout.h   (C structs + static_asserts + channel/config tables)
#   autohaul/io/_layout.py                      (ctypes structures + the same tables)
# Bump `version` on any incompatible change. A hash of both spec files is embedded in the
# shared memory header, so a DLL/Python mismatch is detected at connect time.
#
# Field types: u8 u16 u32 u64 s32 s64 f32 f64, char[N], <type>[N], or a struct name (optionally [N]).
# N may be a literal or a constant from [constants].

version = 1

[constants]
RING_SLOTS = 8          # telemetry frames kept in the ring
EVENT_SLOTS = 64        # gameplay event ring
MAX_WHEELS = 16
MAX_TRAILERS = 4
MAX_FORWARD_GEARS = 32
MAX_REVERSE_GEARS = 8
CHANNEL_SEEN_WORDS = 4  # 256 bits: one per registered channel id
MAX_EXTRA_KILL_VK = 8

[names]
telemetry_mapping = 'Local\AutoHaul_Telemetry'
controls_mapping = 'Local\AutoHaul_Controls'
frame_event = 'Local\AutoHaul_Frame'
telemetry_magic = 0x4C544841   # "AHTL"
controls_magic = 0x54434841    # "AHCT"

# ---------------------------------------------------------------- common

[[struct]]
name = "Vec3"
fields = [["x", "f32"], ["y", "f32"], ["z", "f32"]]

[[struct]]
name = "DPlacement"      # world position (metres) + orientation (SDK unit angles)
fields = [
  ["x", "f64"], ["y", "f64"], ["z", "f64"],
  ["heading", "f32"], ["pitch", "f32"], ["roll", "f32"], ["_pad", "u32"],
]

[[struct]]
name = "FPlacement"
fields = [
  ["x", "f32"], ["y", "f32"], ["z", "f32"],
  ["heading", "f32"], ["pitch", "f32"], ["roll", "f32"],
]

# ---------------------------------------------------------------- telemetry frame

[[struct]]
name = "TrailerFrame"
fields = [
  ["placement", "DPlacement"],
  ["local_linear_velocity", "Vec3"],
  ["local_angular_velocity", "Vec3"],
  ["local_linear_acceleration", "Vec3"],
  ["local_angular_acceleration", "Vec3"],
  ["cargo_damage", "f32"],
  ["wear_body", "f32"],
  ["wear_chassis", "f32"],
  ["wear_wheels", "f32"],
  ["connected", "u8"],
  ["_pad", "u8[3]"],
]

[[struct]]
name = "TelemetryFrame"
fields = [
  ["seq_begin", "u64"],
  ["frame_index", "u64"],               # telemetry frames since the DLL loaded
  ["publish_qpc", "u64"],               # QueryPerformanceCounter at frame_end
  ["render_time_us", "u64"],
  ["simulation_time_us", "u64"],
  ["paused_simulation_time_us", "u64"],
  ["frame_flags", "u32"],
  ["paused", "u32"],
  ["game_time", "u32"],                 # in-game minutes since day 0 00:00
  ["next_rest_stop", "s32"],            # in-game minutes
  ["next_mandatory_break", "s32"],      # in-game minutes (not available on 1.53)
  ["multiplayer_time_offset", "s32"],
  ["local_scale", "f32"],
  ["_pad0", "u32"],
  ["truck_placement", "DPlacement"],
  ["local_linear_velocity", "Vec3"],
  ["local_angular_velocity", "Vec3"],
  ["local_linear_acceleration", "Vec3"],
  ["local_angular_acceleration", "Vec3"],
  ["cabin_offset", "FPlacement"],
  ["head_offset", "FPlacement"],
  ["speed", "f32"],                     # m/s, negative when reversing
  ["engine_rpm", "f32"],
  ["engine_gear", "s32"],
  ["displayed_gear", "s32"],
  ["input_steering", "f32"],            # counterclockwise positive (SDK convention)
  ["input_throttle", "f32"],
  ["input_brake", "f32"],
  ["input_clutch", "f32"],
  ["effective_steering", "f32"],
  ["effective_throttle", "f32"],
  ["effective_brake", "f32"],
  ["effective_clutch", "f32"],
  ["cruise_control", "f32"],            # m/s, 0 = off
  ["hshifter_slot", "u32"],
  ["retarder_level", "u32"],
  ["brake_air_pressure", "f32"],
  ["brake_temperature", "f32"],
  ["fuel", "f32"],
  ["fuel_average_consumption", "f32"],
  ["fuel_range", "f32"],                # km
  ["adblue", "f32"],
  ["adblue_average_consumption", "f32"],
  ["oil_pressure", "f32"],
  ["oil_temperature", "f32"],
  ["water_temperature", "f32"],
  ["battery_voltage", "f32"],
  ["dashboard_backlight", "f32"],
  ["light_aux_front", "u32"],
  ["light_aux_roof", "u32"],
  ["wear_engine", "f32"],
  ["wear_transmission", "f32"],
  ["wear_cabin", "f32"],
  ["wear_chassis", "f32"],
  ["wear_wheels", "f32"],
  ["odometer", "f32"],                  # km
  ["navigation_distance", "f32"],       # m
  ["navigation_time", "f32"],           # s
  ["navigation_speed_limit", "f32"],    # m/s
  ["job_cargo_damage", "f32"],
  ["parking_brake", "u8"],
  ["motor_brake", "u8"],
  ["air_pressure_warning", "u8"],
  ["air_pressure_emergency", "u8"],
  ["fuel_warning", "u8"],
  ["adblue_warning", "u8"],
  ["oil_pressure_warning", "u8"],
  ["water_temperature_warning", "u8"],
  ["battery_voltage_warning", "u8"],
  ["electric_enabled", "u8"],
  ["engine_enabled", "u8"],
  ["lblinker", "u8"],
