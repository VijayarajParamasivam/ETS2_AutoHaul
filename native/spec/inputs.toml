# Inputs of the AutoHaul semantical SDK device. Each `mix` must appear as `semantical.<mix>?0`
# in the game's controls.sii (checked on 1.53.2.1, profile 56696A6179, 2026-10-19).
#
# kind: axis  -> float value (steering -1..1, pedals 0..1, UI stick deflection 0..1)
#       hold  -> bool held while the client says so (horn, trailer brake, ...)
#       pulse -> bool, one press per client pulse (the DLL emits True for one input frame, then False)
# The DLL supports hold and pulse for every button; `kind` only picks the default Python API.
#
# Axes are listed first; their order defines the axis indices.

axes = [
  # mix,        display name,       description
  ["steering",  "Steering",         "+1 = full right, -1 = full left (the game subtracts this from its CCW steering mix)"],
  ["aforward",  "Throttle",         "0..1"],
  ["abackward", "Brake",            "0..1"],
  ["clutch",    "Clutch",           "0..1"],
